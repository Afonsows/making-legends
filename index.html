<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0B0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Making Legends" />
    <meta name="description" content="Hábitos diários e desafios de vários dias, com progresso que você enxerga." />

    <title>Making Legends</title>

    <!-- Aplica o tema (claro/escuro) antes da primeira pintura, para não piscar -->
    <script>
      (function () {
        var mode = 'dark';
        try {
          var saved = JSON.parse(localStorage.getItem('shinobi_ui_prefs_v1') || '{}');
          if (saved && saved.state && saved.state.themeMode) mode = saved.state.themeMode;
        } catch (e) {}
        if (mode === 'system') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        var root = document.documentElement;
        root.classList.remove('dark', 'light');
        root.classList.add(mode === 'light' ? 'light' : 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'light' ? '#161410' : '#0C0B0A');
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Yuji+Syuku&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen antialiased overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
